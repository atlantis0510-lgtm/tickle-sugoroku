<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くすぐりすごろく</title>
<style>
  :root {
    --primary-color: #ffa6c0; 
    --secondary-color: #ffc2d4;
    --bg-color: #fff5f7;
    --text-color: #5c4046;
    --accent-color: #ff7aa0;
  }

  body {
    font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  h1 {
    text-align: center;
    color: var(--primary-color);
    border-bottom: 2px dashed var(--secondary-color);
    padding-bottom: 10px;
  }

  /* CSV読み込みエリア */
  .csv-upload-section {
    text-align: center;
    margin-bottom: 15px;
    padding: 10px;
    background-color: #fafafa;
    border-radius: 8px;
    border: 1px dashed #ccc;
  }
  .csv-btn {
    background: white;
    border: 2px solid var(--text-color);
    color: var(--text-color);
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    display: inline-block;
    transition: 0.2s;
  }
  .csv-btn:hover {
    background: #eee;
  }
  #fileNameDisplay {
    margin-left: 10px;
    font-size: 0.9em;
    color: #666;
  }

  /* タブUI（絵文字削除） */
  .tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--secondary-color);
    padding-bottom: 10px;
  }
  .tab-buttons button {
    background: transparent;
    border: 2px solid var(--primary-color);
    color: var(--primary-color);
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-buttons button.active {
    background: var(--primary-color);
    color: white;
  }
  .tab-content {
    display: none;
    animation: fadeIn 0.3s;
  }
  .tab-content.active {
    display: block;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ルール表示エリア */
  .rules-box {
    background-color: var(--bg-color);
    border-left: 5px solid var(--primary-color);
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 4px;
    font-size: 0.95em;
  }

  /* プレイタブのスタイル */
  .timer-section {
    text-align: center;
    margin-bottom: 20px;
    padding: 15px;
    background: var(--bg-color);
    border-radius: 10px;
  }
  .timer-display {
    font-size: 3.5em;
    font-weight: bold;
    color: var(--accent-color);
    font-variant-numeric: tabular-nums;
    margin-bottom: 10px;
  }
  .timer-controls button {
    background: white;
    border: 2px solid var(--primary-color);
    color: var(--primary-color);
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    margin: 0 5px;
    font-weight: bold;
  }
  .timer-controls button:hover {
    background: var(--primary-color);
    color: white;
  }

  /* 盤面 */
  .board-container {
    margin: 20px 0;
    padding: 15px 0;
    background: #fdfdfd;
    border-radius: 10px;
    border: 1px solid #eee;
  }
  .board-scroll {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px 20px;
    scroll-behavior: smooth;
    align-items: center;
  }
  .space {
    flex: 0 0 auto;
    width: 100px;
    height: 100px;
    border: 3px solid var(--secondary-color);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: white;
    position: relative;
    transition: 0.3s;
  }
  .space .num { font-size: 0.9em; color: #999; position: absolute; top: 5px; left: 8px; }
  .space .type { font-weight: bold; font-size: 1.1em; margin-top: 10px; text-align: center; }
  .space.active {
    border-color: var(--accent-color);
    background: var(--accent-color);
    color: white;
    transform: scale(1.1);
  }
  .space.active .num { color: white; }

  /* ログ＆各種ボタン */
  .dice-btn {
    width: 100%; background: var(--primary-color); color: white; border: none;
    padding: 20px; font-size: 1.5em; border-radius: 30px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
  }
  .log-area { height: 200px; overflow-y: auto; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; font-size: 0.95em; }
  .log-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #ccc; }
  .log-item:last-child { border-bottom: none; }

  /* ゲームオーバー・オーバーレイ */
  .overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 245, 247, 0.95); z-index: 1000;
    justify-content: center; align-items: center; flex-direction: column; text-align: center;
  }
  .overlay h2 { font-size: 3em; color: var(--accent-color); margin-bottom: 10px; }
  .overlay p { font-size: 2em; font-weight: bold; color: var(--text-color); margin-bottom: 30px; }
  .overlay button {
    background: white; border: 2px solid var(--accent-color); color: var(--accent-color);
    padding: 10px 20px; font-size: 1.2em; border-radius: 10px; cursor: pointer; font-weight: bold;
  }

  /* テキストエリア */
  textarea { width: 100%; height: 300px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; font-size: 14px; box-sizing: border-box; }
  .action-btn { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>くすぐりすごろく</h1>
  
  <div class="rules-box">
    <strong>【ルール】</strong><br>
    くすぐられる側が進めるすごろくです。止まったマスの指示に従う必要があります。<br>
    ゴールまでの制限時間は１時間です。<br>
    制限時間内にゴールできない、または途中でギブアップするなどした場合は罰ゲームとして、<strong>相手の気が済むまでくすぐり続けられます。</strong>
  </div>

  <!-- CSV読み込みエリア -->
  <div class="csv-upload-section">
    <label for="csvFileInput" class="csv-btn">CSVファイルを選択して盤面を更新</label>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
    <span id="fileNameDisplay">ファイルが選択されていません</span>
  </div>

  <!-- タブボタン -->
  <div class="tab-buttons">
    <button class="active" onclick="switchTab('tab-play', this)">プレイ</button>
    <button onclick="switchTab('tab-sim', this)">一括結果表示</button>
  </div>

  <!-- タブ: プレイ -->
  <div id="tab-play" class="tab-content active">
    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">60:00</div>
      <div class="timer-controls">
        <button onclick="startTimer()">▶ スタート</button>
        <button onclick="stopTimer()">⏸ ストップ</button>
        <button onclick="addTime(10)">＋10秒</button>
        <button onclick="addTime(-10)">－10秒</button>
      </div>
    </div>
    <button class="dice-btn" id="diceBtn" onclick="takeTurn()">サイコロを振る</button>
    <div class="board-container">
      <div class="board-scroll" id="boardScroll"></div>
    </div>
    <div class="log-area" id="logArea">
      <div class="log-item">ゲームスタート！サイコロを振ってください。</div>
    </div>
  </div>

  <!-- タブ: 一括結果表示 -->
  <div id="tab-sim" class="tab-content">
    <p>現在の設定で、ゴール（または時間切れ）まで一気にシミュレーションを実行します。</p>
    <button class="action-btn" onclick="runSimulation()">シミュレーション実行</button>
    <textarea id="simOutput" readonly placeholder="ここに結果が出力されます..." style="margin-top:15px; height: 400px;"></textarea>
  </div>

</div>

<!-- ゲームオーバー画面 -->
<div class="overlay" id="gameOverOverlay">
  <h2>制限時間オーバー<br>（ゲームオーバー）</h2>
  <p>好きなだけくすぐられる</p>
  <button onclick="closeGameOver()">閉じてログ・盤面を確認する</button>
</div>

<script>
  // --- システム変数 ---
  let timeLeft = 3600;
  let timerInterval = null;
  let isRunning = false;
  let currentPosition = 0;
  let boardSize = 40;
  let board = [];

  // --- タブ切り替え ---
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-buttons button').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  // --- 初期化 ---
  window.onload = () => {
    generateDefaultBoard();
    updateTimerDisplay();
  };

  // --- デフォルトの盤面生成 ---
  function generateDefaultBoard() {
    board = [];
    for(let i = 0; i <= 40; i++) {
      let type = '通常';
      if(i === 0) type = 'スタート';
      else if(i === 40) type = 'ゴール';
      else if(i === 38) type = '∞';
      else if(i % 7 === 0) type = '指示5';
      else if(i % 5 === 0) type = '指示4';
      else if(i % 11 === 0) type = '指示3';
      else if(i % 9 === 0) type = '指示2';
      else if(i % 4 === 0) type = '指示1';
      board.push({ num: i, type: type });
    }
    boardSize = board.length - 1;
    renderBoard();
  }

  // --- CSVファイルのアップロード処理 ---
  function handleCSVUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('fileNameDisplay').innerText = `読込中: ${file.name}`;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      parseCSVText(text);
      document.getElementById('fileNameDisplay').innerText = `読込完了: ${file.name}`;
    };
    // Excel等で作成したCSVの文字化けを防ぐため、とりあえず読み込む（文字化けする場合はUTF-8で保存してください）
    reader.readAsText(file);
  }

  function parseCSVText(csvText) {
    const lines = csvText.trim().split('\n');
    let newBoard = [];
    
    lines.forEach(line => {
      if(!line) return;
      const parts = line.split(',');
      if(parts.length >= 2) {
        // 余計な空白やクオーテーションを除去
        const num = parseInt(parts[0].replace(/"/g, '').trim());
        const type = parts[1].replace(/"/g, '').trim();
        if(!isNaN(num)) {
          newBoard.push({ num: num, type: type });
        }
      }
    });

    if (newBoard.length > 0) {
      board = newBoard;
      boardSize = board.length - 1;
      currentPosition = 0;
      timeLeft = 3600; // 1時間にリセット
      stopTimer();
      updateTimerDisplay();
      renderBoard();
      log("📁 CSVデータを読み込み、盤面とタイマーをリセットしました。");
    } else {
      alert("CSVから有効なマス情報を読み込めませんでした。フォーマットを確認してください。");
      document.getElementById('fileNameDisplay').innerText = "読み込みエラー";
    }
  }

  // --- プレイ機能 ---
  function startTimer() {
    if(isRunning || timeLeft <= 0) return;
    isRunning = true;
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if(timeLeft <= 0) triggerGameOver();
    }, 1000);
    log("タイマーをスタートしました。");
  }
  function stopTimer() {
    if(!isRunning) return;
    isRunning = false;
    clearInterval(timerInterval);
    log("タイマーをストップしました。");
  }
  function addTime(seconds) {
    timeLeft += seconds;
    if(timeLeft < 0) timeLeft = 0;
    updateTimerDisplay();
    if(timeLeft <= 0) triggerGameOver();
  }
  function updateTimerDisplay() {
    if(timeLeft < 0) timeLeft = 0;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    document.getElementById('timerDisplay').innerText = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  function triggerGameOver() {
    timeLeft = 0;
    updateTimerDisplay();
    stopTimer();
    document.getElementById('gameOverOverlay').style.display = 'flex';
  }
  function closeGameOver() {
    document.getElementById('gameOverOverlay').style.display = 'none';
  }
  function renderBoard() {
    const scrollContainer = document.getElementById('boardScroll');
    scrollContainer.innerHTML = '';
    board.forEach((space, index) => {
      const el = document.createElement('div');
      el.className = `space ${index === currentPosition ? 'active' : ''}`;
      el.id = `space-${index}`;
      el.innerHTML = `<div class="num">${space.num}</div><div class="type">${space.type}</div>`;
      scrollContainer.appendChild(el);
    });
    setTimeout(() => {
      const activeEl = document.getElementById(`space-${currentPosition}`);
      if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }, 100);
  }
  function log(message) {
    const logArea = document.getElementById('logArea');
    const item = document.createElement('div');
    item.className = 'log-item';
    const timeStr = document.getElementById('timerDisplay').innerText;
    item.innerHTML = `<strong>[残り ${timeStr}]</strong> ${message}`;
    logArea.prepend(item);
  }
  function rollDice1to6() { return Math.floor(Math.random() * 6) + 1; }

  function takeTurn() {
    if(timeLeft <= 0) { alert("時間切れです！"); return; }
    if(!isRunning) { alert("タイマーが動いていません。スタートボタンを押してください！"); return; }

    const dice = rollDice1to6();
    log(`🎲 サイコロを振った！出目は【${dice}】`);
    movePlayer(dice);
  }

  function movePlayer(steps) {
    currentPosition += steps;
    if(currentPosition < 0) currentPosition = 0;
    if(currentPosition > boardSize) currentPosition = boardSize;
    renderBoard();
    
    setTimeout(() => {
      let state = { time: timeLeft, pos: currentPosition, needReEval: false };
      let logs = handleEventLogic(board[currentPosition].type, state, false);
      
      logs.forEach(l => log(l));
      timeLeft = state.time;
      updateTimerDisplay();
      
      if(state.needReEval) {
        // 戻った場合の再処理
        setTimeout(() => { movePlayer(state.pos - currentPosition); }, 1500);
      }
      
      if(timeLeft <= 0) triggerGameOver();
      else if(board[currentPosition].type === 'ゴール') {
        log(`<strong>【ゴール】クリアおめでとうございます！！</strong>`);
        stopTimer();
      }
    }, 500);
  }

  // --- イベント計算ロジック（プレイ・一括表示 共通） ---
  function handleEventLogic(type, state, isSim) {
    let logs = [];
    if(type === 'スタート' || type === '通常' || type === '') {
      logs.push("何事もなく無事に通過。");
    }
    else if(type === '指示1') {
      let sum = 0, rolls = [];
      for(let i=0; i<5; i++) { let r=rollDice1to6(); sum+=r; rolls.push(r); }
      let pen = sum * 60;
      state.time -= pen;
      logs.push(`【指示1】サイコロ5回(${rolls.join(',')}) 合計${sum} × 60秒 ＝ <strong>${pen}秒</strong> 消費。`);
    }
    else if(type === '指示2') {
      let chooseRest = false;
      if(isSim) { chooseRest = Math.random() < 0.5; }
      else { chooseRest = confirm("【指示2】\n3分間休憩するか、3分間くすぐられるか選べます。\n休憩を選んだ場合は、残り時間をさらに20分減らします。\n\n[OK] 休憩する（残り時間-20分＆3分消費）\n[キャンセル] くすぐられる（3分消費）"); }

      if(chooseRest) {
        state.time -= (23 * 60);
        logs.push(`【指示2】休憩を選んだ。ペナルティ20分と休憩3分で、合計<strong>23分</strong> 消費。`);
      } else {
        state.time -= (3 * 60);
        logs.push(`【指示2】くすぐられるのを選んだ。<strong>3分</strong> 消費。`);
      }
    }
    else if(type === '指示3') {
      let r = rollDice1to6();
      if(r === 1 || r === 6) {
        state.time -= (5 * 60);
        logs.push(`【指示3】出目【${r}】。休憩を引き当てた！<strong>5分</strong> 消費。`);
      } else {
        state.time -= 150;
        logs.push(`【指示3】出目【${r}】。指示されたポーズでくすぐられる！<strong>150秒</strong> 消費し、<strong>6マス戻る</strong>！`);
        state.pos -= 6;
        if(state.pos < 0) state.pos = 0;
        state.needReEval = true; 
      }
    }
    else if(type === '指示4') {
      let r = rollDice1to6();
      let pen = (r * 60) * 2;
      state.time -= pen;
      logs.push(`【指示4】出目【${r}】。声出し＆動作禁止！ 出目×60秒×2回分 ＝ <strong>${pen}秒（${pen/60}分）</strong> 消費。`);
    }
    else if(type === '指示5') {
      let r = rollDice1to6();
      let pen = (r * 10 * 60) * 2;
      state.time -= pen;
      logs.push(`【指示5】出目【${r}】。拘束＆声出し禁止！ 出目×10分×2回分 ＝ <strong>${pen}秒（${pen/60}分）</strong> 消費。`);
    }
    else if(type === '∞') {
      logs.push(`<strong>【∞マス】制限時間までくすぐられる！タイマーが0になります。</strong>`);
      state.time = 0;
    }
    else if(type === 'ゴール') {
      // ログ出力なし（上位の関数で処理）
    }
    else {
      // 想定外のテキストがCSVに入っていた場合
      logs.push(`【${type}】特別な指示はありませんでした。`);
    }
    return logs;
  }

  // --- 一括結果表示（シミュレーション） ---
  function runSimulation() {
    let state = { time: 3600, pos: 0, needReEval: false };
    let out = "--- シミュレーション開始 ---\n初期制限時間: 60分00秒\n\n";
    let turn = 1;

    const strip = (html) => html.replace(/<[^>]*>?/gm, '');

    while(state.time > 0 && state.pos < boardSize) {
      state.needReEval = false;
      let d = rollDice1to6();
      state.pos += d;
      if(state.pos > boardSize) state.pos = boardSize;

      out += `[ターン${turn}] 🎲出目:${d} -> 【${state.pos}マス目】へ移動\n`;
      let logs = handleEventLogic(board[state.pos].type, state, true);
      out += logs.map(l => "  " + strip(l)).join("\n") + "\n";

      while(state.needReEval && state.time > 0) {
        state.needReEval = false;
        out += `  -> 戻った先【${state.pos}マス目】のイベント発動\n`;
        let logs2 = handleEventLogic(board[state.pos].type, state, true);
        out += logs2.map(l => "    " + strip(l)).join("\n") + "\n";
      }

      let m = Math.max(0, Math.floor(state.time / 60));
      let s = Math.max(0, state.time % 60);
      out += `  (残り時間: ${m}分${s}秒)\n\n`;

      if(board[state.pos].type === 'ゴール' || board[state.pos].type === '∞') break;
      turn++;
    }

    if(state.time <= 0) {
      out += "=============================\n【ゲームオーバー】制限時間オーバー\n=============================\n";
    } else {
      out += "=============================\n【クリア】制限時間内にゴール到達！\n=============================\n";
    }
    document.getElementById('simOutput').value = out;
  }
</script>
</body>
</html>
