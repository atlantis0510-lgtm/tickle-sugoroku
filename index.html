<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くすぐりすごろく</title>
<style>
  :root {
    /* 2. 全体的に淡いピンク系のカラーテーマに変更 */
    --primary-color: #ffa6c0; /* 淡いピンク */
    --secondary-color: #ffc2d4;
    --bg-color: #fff5f7;
    --text-color: #5c4046;
    --accent-color: #ff7aa0;
  }

  body {
    font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  h1 {
    text-align: center;
    color: var(--primary-color);
    border-bottom: 2px dashed var(--secondary-color);
    padding-bottom: 10px;
  }

  /* 7. ルール表示エリア */
  .rules-box {
    background-color: var(--bg-color);
    border-left: 5px solid var(--primary-color);
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 4px;
    font-size: 0.95em;
  }

  /* タイマーエリア */
  .timer-section {
    text-align: center;
    margin-bottom: 20px;
    padding: 15px;
    background: var(--bg-color);
    border-radius: 10px;
  }

  .timer-display {
    font-size: 3.5em;
    font-weight: bold;
    color: var(--accent-color);
    font-variant-numeric: tabular-nums;
    margin-bottom: 10px;
  }

  /* 6. タイマーコントロールボタン */
  .timer-controls button {
    background: white;
    border: 2px solid var(--primary-color);
    color: var(--primary-color);
    padding: 8px 15px;
    font-size: 1em;
    border-radius: 20px;
    cursor: pointer;
    margin: 0 5px;
    font-weight: bold;
    transition: 0.2s;
  }
  .timer-controls button:hover {
    background: var(--primary-color);
    color: white;
  }

  /* 1. 横スクロール盤面 */
  .board-container {
    margin: 20px 0;
    padding: 15px 0;
    background: #fdfdfd;
    border-radius: 10px;
    border: 1px solid #eee;
  }
  .board-scroll {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px 20px;
    scroll-behavior: smooth;
    align-items: center;
  }
  .board-scroll::-webkit-scrollbar {
    height: 10px;
  }
  .board-scroll::-webkit-scrollbar-thumb {
    background: var(--secondary-color);
    border-radius: 5px;
  }
  
  .space {
    flex: 0 0 auto;
    width: 100px;
    height: 100px;
    border: 3px solid var(--secondary-color);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: white;
    position: relative;
    transition: 0.3s;
  }
  .space .num {
    font-size: 0.9em;
    color: #999;
    position: absolute;
    top: 5px;
    left: 8px;
  }
  .space .type {
    font-weight: bold;
    font-size: 1.1em;
    margin-top: 10px;
    text-align: center;
  }
  .space.active {
    border-color: var(--accent-color);
    background: var(--accent-color);
    color: white;
    transform: scale(1.1);
    box-shadow: 0 5px 15px rgba(255, 122, 160, 0.4);
  }
  .space.active .num { color: white; }

  /* サイコロボタン */
  .dice-btn {
    display: block;
    width: 100%;
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 20px;
    font-size: 1.5em;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
    margin-bottom: 20px;
  }
  .dice-btn:hover {
    background: var(--accent-color);
    transform: translateY(-2px);
  }
  .dice-btn:active {
    transform: translateY(2px);
  }

  /* ログエリア */
  .log-area {
    height: 200px;
    overflow-y: auto;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    font-size: 0.95em;
  }
  .log-item {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #ccc;
  }
  .log-item:last-child {
    border-bottom: none;
  }

  /* ゲームオーバー・オーバーレイ */
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 245, 247, 0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
  }
  .overlay h2 {
    font-size: 3em;
    color: var(--accent-color);
    margin-bottom: 10px;
  }
  /* 5. 好きなだけくすぐられるのテキスト */
  .overlay p {
    font-size: 2em;
    font-weight: bold;
    color: var(--text-color);
  }
</style>
</head>
<body>

<div class="container">
  <h1>くすぐりすごろく</h1>

  <!-- 7. ルール表示 -->
  <div class="rules-box">
    <strong>【ルール】</strong><br>
    くすぐられる側が進めるすごろくです。止まったマスの指示に従う必要があります。<br>
    ゴールまでの制限時間は１時間です。<br>
    制限時間内にゴールできない、または途中でギブアップするなどした場合は罰ゲームとして、<strong>相手の気が済むまでくすぐり続けられます。</strong>
  </div>

  <!-- タイマーエリア -->
  <div class="timer-section">
    <div class="timer-display" id="timerDisplay">60:00</div>
    <div class="timer-controls">
      <button onclick="startTimer()">▶ スタート</button>
      <button onclick="stopTimer()">⏸ ストップ</button>
      <button onclick="addTime(10)">＋10秒</button>
      <button onclick="addTime(-10)">－10秒</button>
    </div>
  </div>

  <!-- サイコロボタン -->
  <button class="dice-btn" id="diceBtn" onclick="takeTurn()">サイコロを振る</button>

  <!-- 1. 盤面表示エリア -->
  <div class="board-container">
    <div class="board-scroll" id="boardScroll">
      <!-- JSで盤面を生成します -->
    </div>
  </div>

  <!-- ログエリア -->
  <div class="log-area" id="logArea">
    <div class="log-item">ゲームスタート！サイコロを振ってください。</div>
  </div>
</div>

<!-- ゲームオーバー画面 -->
<div class="overlay" id="gameOverOverlay">
  <h2>制限時間オーバー<br>（ゲームオーバー）</h2>
  <p>好きなだけくすぐられる</p>
</div>

<script>
  // --- ゲームステータス管理 ---
  let timeLeft = 3600; // 1時間 = 3600秒
  let timerInterval = null;
  let isRunning = false;
  let currentPosition = 0;
  
  // 盤面データ生成 (全40マス)
  const boardSize = 40;
  const board = [];
  
  for(let i = 0; i <= boardSize; i++) {
    if(i === 0) board.push({ num: 0, type: 'スタート', class: 'normal' });
    else if(i === boardSize) board.push({ num: i, type: 'ゴール', class: 'goal' });
    else if(i === 38) board.push({ num: i, type: '∞', class: 'inf' });
    else if(i % 7 === 0) board.push({ num: i, type: '指示5', class: 'event5' });
    else if(i % 5 === 0) board.push({ num: i, type: '指示4', class: 'event4' });
    else if(i % 11 === 0) board.push({ num: i, type: '指示3', class: 'event3' });
    else if(i % 9 === 0) board.push({ num: i, type: '指示2', class: 'event2' });
    else if(i % 4 === 0) board.push({ num: i, type: '指示1', class: 'event1' });
    else board.push({ num: i, type: '通常', class: 'normal' });
  }

  // --- 初期化処理 ---
  window.onload = () => {
    renderBoard();
    updateTimerDisplay();
  };

  // --- タイマー処理 (6. 要望のスタート・ストップ機能) ---
  function startTimer() {
    if(isRunning || timeLeft <= 0) return;
    isRunning = true;
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if(timeLeft <= 0) triggerGameOver();
    }, 1000);
    log("タイマーをスタートしました。");
  }

  function stopTimer() {
    if(!isRunning) return;
    isRunning = false;
    clearInterval(timerInterval);
    log("タイマーをストップしました。");
  }

  function addTime(seconds) {
    timeLeft += seconds;
    if(timeLeft < 0) timeLeft = 0;
    updateTimerDisplay();
    if(timeLeft <= 0) triggerGameOver();
  }

  function updateTimerDisplay() {
    if(timeLeft < 0) timeLeft = 0;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    document.getElementById('timerDisplay').innerText = 
      String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function triggerGameOver() {
    timeLeft = 0;
    updateTimerDisplay();
    stopTimer();
    document.getElementById('gameOverOverlay').style.display = 'flex';
  }

  // --- 盤面描画 ---
  function renderBoard() {
    const scrollContainer = document.getElementById('boardScroll');
    scrollContainer.innerHTML = '';
    
    board.forEach((space, index) => {
      const el = document.createElement('div');
      el.className = `space ${index === currentPosition ? 'active' : ''}`;
      el.id = `space-${index}`;
      
      el.innerHTML = `
        <div class="num">${space.num}</div>
        <div class="type">${space.type}</div>
      `;
      scrollContainer.appendChild(el);
    });

    // 1. 現在のマスが中央に来るように自動スクロール
    setTimeout(() => {
      const activeEl = document.getElementById(`space-${currentPosition}`);
      if(activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }, 100);
  }

  // --- ログ出力 ---
  function log(message) {
    const logArea = document.getElementById('logArea');
    const item = document.createElement('div');
    item.className = 'log-item';
    
    const timeStr = document.getElementById('timerDisplay').innerText;
    item.innerHTML = `<strong>[残り ${timeStr}]</strong> ${message}`;
    
    logArea.prepend(item);
  }

  function rollDice1to6() {
    return Math.floor(Math.random() * 6) + 1;
  }

  // --- ゲーム進行（サイコロを振る） ---
  function takeTurn() {
    if(timeLeft <= 0) {
      alert("時間切れです！");
      return;
    }
    if(!isRunning) {
      alert("タイマーが動いていません。スタートボタンを押してください！");
      return;
    }

    const dice = rollDice1to6();
    log(`🎲 サイコロを振った！出目は【${dice}】`);
    
    movePlayer(dice);
  }

  function movePlayer(steps) {
    currentPosition += steps;
    if(currentPosition < 0) currentPosition = 0;
    if(currentPosition >= boardSize) currentPosition = boardSize;
    
    renderBoard();
    
    // アニメーションを待ってからイベント処理
    setTimeout(() => {
      handleEvent(board[currentPosition]);
    }, 500);
  }

  // --- 3. 各マスのイベント処理 ---
  function handleEvent(space) {
    const type = space.type;
    
    if(type === 'スタート' || type === '通常') {
      log("何事もなく無事に通過。");
    }
    else if(type === '指示1') {
      // 3-1: サイコロを5回振って、出目の合計×60秒とする。
      let sum = 0;
      let rollsText = [];
      for(let i=0; i<5; i++) {
        let r = rollDice1to6();
        sum += r;
        rollsText.push(r);
      }
      let penaltyTime = sum * 60;
      addTime(-penaltyTime);
      log(`【指示1】サイコロを5回振った！(出目: ${rollsText.join(', ')})<br>
           合計【${sum}】× 60秒 ＝ <strong>${penaltyTime}秒（${sum}分）</strong> 消費。`);
    }
    else if(type === '指示2') {
      // 3-2: 3分間とする（休憩を選ぶと残り時間-20分）
      setTimeout(() => {
        let confirmRest = confirm("【指示2】\n3分間休憩するか、3分間くすぐられるか選べます。\n休憩を選んだ場合は、残り時間をさらに20分減らします。\n\n休憩を選びますか？\n[OK] 休憩する（残り時間-20分＆3分消費）\n[キャンセル] くすぐられる（3分消費）");
        
        if(confirmRest) {
          addTime(-(20 * 60)); // 20分マイナス
          addTime(-(3 * 60));  // 3分消費
          log(`【指示2】休憩を選んだ。ペナルティ20分と休憩3分で、合計<strong>23分</strong>消費。`);
        } else {
          addTime(-(3 * 60));  // 3分消費
          log(`【指示2】くすぐられるのを選んだ。<strong>3分</strong>消費。`);
        }
      }, 100);
    }
    else if(type === '指示3') {
      // 3-3: 1,6なら5分使う、2,3,4,5なら150秒使って6マス戻る
      let r = rollDice1to6();
      if(r === 1 || r === 6) {
        addTime(-(5 * 60)); // 5分 = 300秒
        log(`【指示3】出目は【${r}】。休憩を引き当てた！<strong>5分</strong>消費。`);
      } else {
        addTime(-150);
        log(`【指示3】出目は【${r}】。指示されたポーズでくすぐられる！<strong>150秒</strong>消費し、<strong>6マス戻る</strong>！`);
        // 戻ったマスの指示に従う
        setTimeout(() => {
          movePlayer(-6);
        }, 1500);
      }
    }
    else if(type === '指示4') {
      // 3-4: 出目×60秒を2回分とする
      let r = rollDice1to6();
      let penaltyTime = (r * 60) * 2;
      addTime(-penaltyTime);
      log(`【指示4】出目は【${r}】。声出し＆動作禁止でくすぐられる！<br>
           出目×60秒×2回分 ＝ <strong>${penaltyTime}秒（${penaltyTime/60}分）</strong> 消費。`);
    }
    else if(type === '指示5') {
      // 3-5: 出目×10分間を2回分とする
      let r = rollDice1to6();
      let penaltyTime = (r * 10 * 60) * 2; // (出目 * 10分 * 60秒) * 2回
      addTime(-penaltyTime);
      log(`【指示5】出目は【${r}】。自由に拘束され、声出し禁止でくすぐられる！<br>
           出目×10分×2回分 ＝ <strong>${penaltyTime}秒（${penaltyTime/60}分）</strong> 消費。`);
    }
    else if(type === '∞') {
      // 4. 制限時間までくすぐられる
      log(`<strong>【∞マス】制限時間までくすぐられる！タイマーが0になります。</strong>`);
      triggerGameOver();
    }
    else if(type === 'ゴール') {
      log(`<strong>【ゴール】クリアおめでとうございます！！</strong>`);
      stopTimer();
    }
  }
</script>
</body>
</html>
