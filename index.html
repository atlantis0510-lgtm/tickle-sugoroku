<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くすぐりすごろく</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>くすぐりすごろく</h1>
  
  <div class="rules-box">
    <strong>【ルール】</strong><br>
    くすぐられる側が進めるすごろくです。止まったマスの指示に従う必要があります。<br>
    ゴールまでの制限時間は１時間です。<br>
    制限時間内にゴールできない、または途中でギブアップするなどした場合は罰ゲームとして、<strong>相手の気が済むまでくすぐり続けられます。</strong>
  </div>

  <!-- CSV読み込みエリア -->
  <div class="csv-upload-section">
    <label for="csvFileInput" class="csv-btn">CSVファイルを手動で読み込む</label>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;">
    <span id="fileNameDisplay">masu.csv を確認中...</span>
  </div>

  <!-- タブボタン -->
  <div class="tab-buttons">
    <button class="active" onclick="switchTab('tab-play', this)">プレイ</button>
    <button onclick="switchTab('tab-sim', this)">一括結果表示</button>
  </div>

  <!-- タブ: プレイ -->
  <div id="tab-play" class="tab-content active">
    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">60:00</div>
      <div id="gameOverMsg" class="game-over-msg" style="display:none;">ゲームオーバー：好きなだけくすぐられる</div>
      <div class="timer-controls">
        <button onclick="startMainTimer()">▶ スタート</button>
        <button onclick="stopMainTimer()">⏸ ストップ</button>
        <button onclick="addMainTime(10)">＋10秒</button>
        <button onclick="addMainTime(-10)">－10秒</button>
      </div>
    </div>

    <!-- アクションパネル (サイコロやイベントのボタンがここに表示されます) -->
    <div id="actionPanel" class="action-panel"></div>

    <div class="board-container">
      <div class="board-scroll" id="boardScroll"></div>
    </div>
    
    <div class="log-area" id="logArea"></div>
  </div>

  <!-- タブ: 一括結果表示 -->
  <div id="tab-sim" class="tab-content">
    <p>現在の設定で、ゴール（または時間切れ）まで一気にシミュレーションを実行します。</p>
    <button class="action-btn" onclick="runSimulation()">シミュレーション実行</button>
    <textarea id="simOutput" readonly placeholder="ここに結果が出力されます..."></textarea>
  </div>

</div>

<!-- スクリプトの読み込み -->
<script src="main.js"></script>
<script src="play.js"></script>
<script src="sim.js"></script>
</body>
</html>
