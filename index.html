<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>くすぐりすごろく</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #e53935; --bg: #f5f5f5; --text: #333; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); user-select: none; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .tabs { display: flex; background: #ddd; }
        .tab { flex: 1; padding: 12px 0; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { border-bottom: 3px solid var(--primary); font-weight: bold; background: white; }
        .content { display: none; padding: 20px; }
        .content.active { display: block; }
        
        /* Play Screen */
        .timer-box { font-size: 2rem; text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--primary); }
        .status-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .dice-btn { display: block; width: 100%; padding: 15px; font-size: 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .dice-btn:active { opacity: 0.8; }
        
        /* Board List */
        .board-item { background: white; padding: 10px; margin-bottom: 5px; border-radius: 5px; border-left: 5px solid #ccc; }
        .type-red { border-left-color: #ff5252; }
        .type-blue { border-left-color: #448aff; }
        .type-purple { border-left-color: #e040fb; }
        .type-red_fill { border-left-color: #d32f2f; }
        .type-instruction { border-left-color: #ffb300; }

        /* Modal */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        #modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 10px; text-align: center; box-sizing: border-box; }
        .modal-btn { display: inline-block; padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn-blue { background: #448aff; color: white; }
        .btn-gray { background: #9e9e9e; color: white; }
        .btn-red { background: #f44336; color: white; }
        .btn-green { background: #4caf50; color: white; }
        
        #scenario-output { width: 100%; height: 300px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>くすぐりすごろく</header>

<div class="tabs">
    <div class="tab active" onclick="switchTab('play')">プレイ</div>
    <div class="tab" onclick="switchTab('list')">盤面一覧</div>
    <div class="tab" onclick="switchTab('scenario')">シナリオ</div>
</div>

<!-- プレイ画面 -->
<div id="tab-play" class="content active">
    <div class="timer-box" id="main-timer-display">残り時間: 60:00</div>
    <div class="status-box">
        <h3 id="current-pos-display">現在地: スタート (マス1)</h3>
    </div>
    <button class="dice-btn" id="main-dice-btn" onclick="rollMainDice()">サイコロを振る</button>
</div>

<!-- 盤面一覧画面 -->
<div id="tab-list" class="content">
    <div id="board-list-container">読み込み中...</div>
</div>

<!-- シナリオ出力画面 -->
<div id="tab-scenario" class="content">
    <button class="modal-btn btn-blue" onclick="generateScenario()" style="width:100%">一括シミュレーション実行</button>
    <textarea id="scenario-output" readonly placeholder="ここに結果が出力されます"></textarea>
</div>

<!-- イベントモーダル -->
<div id="modal-overlay">
    <div id="modal-content">
        <h2 id="modal-title">マス</h2>
        <p id="modal-text">指示内容</p>
        
        <div id="modal-sub-timer-area" style="display:none;">
            <h3 id="modal-sub-timer-display" style="color:var(--primary); font-size:2rem;">00:00</h3>
        </div>

        <div id="modal-controls">
            <!-- JSで動的にボタンを配置 -->
        </div>
    </div>
</div>

<script>
    // サービスワーカー登録 (PWA用)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    let boardData = [];
    let currentPos = 0; // 配列インデックス(0〜)
    
    // メインタイマー (60分 = 3600秒)
    let mainTimeLeft = 3600;
    let mainTimerInterval = null;

    // サブタイマー (モーダル用)
    let subTime = 0;
    let subTimerInterval = null;
    let subTimerMode = 'down'; // 'down' or 'up'

    // 初期化: CSV読み込み
    window.onload = async () => {
        try {
            const response = await fetch('masu.csv');
            const csvText = await response.text();
            parseCSV(csvText);
            renderBoardList();
            startMainTimer();
        } catch (e) {
            alert('masu.csvの読み込みに失敗しました。ファイルが存在するか確認してください。');
        }
    };

    function parseCSV(text) {
        const lines = text.trim().split('\n');
        boardData = [];
        for (let i = 1; i < lines.length; i++) { // ヘッダー行をスキップ
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(',');
            boardData.push({
                id: cols[0], type: cols[1], value: cols[2], text: cols.slice(3).join(',') // テキスト内のカンマ対応
            });
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
    }

    // --- メインタイマー処理 ---
    function startMainTimer() {
        if(mainTimerInterval) clearInterval(mainTimerInterval);
        mainTimerInterval = setInterval(() => {
            if(mainTimeLeft > 0) {
                mainTimeLeft--;
                updateMainTimerDisplay();
            } else {
                clearInterval(mainTimerInterval);
                alert("【時間切れ】制限時間が終了しました！罰ゲームへ移行してください。");
                document.getElementById('main-dice-btn').disabled = true;
            }
        }, 1000);
    }

    function updateMainTimerDisplay() {
        const m = Math.floor(mainTimeLeft / 60).toString().padStart(2, '0');
        const s = (mainTimeLeft % 60).toString().padStart(2, '0');
        document.getElementById('main-timer-display').innerText = `残り時間: ${m}:${s}`;
    }

    // --- プレイ機能 ---
    function rollMainDice() {
        const dice = Math.floor(Math.random() * 6) + 1;
        alert(`サイコロの目は【 ${dice} 】です！`);
        currentPos += dice;
        if(currentPos >= boardData.length - 1) currentPos = boardData.length - 1; // ゴールで止まる
        
        updatePositionDisplay();
        handleSquareEvent(boardData[currentPos]);
    }

    function updatePositionDisplay() {
        const square = boardData[currentPos];
        document.getElementById('current-pos-display').innerText = `現在地: マス${square.id} (${square.type})`;
    }

    // --- モーダル・マス処理 ---
    function handleSquareEvent(square) {
        const overlay = document.getElementById('modal-overlay');
        const title = document.getElementById('modal-title');
        const text = document.getElementById('modal-text');
        const controls = document.getElementById('modal-controls');
        const timerArea = document.getElementById('modal-sub-timer-area');
        
        // リセット
        stopSubTimer();
        controls.innerHTML = '';
        timerArea.style.display = 'none';
        
        title.innerText = `マス${square.id}`;
        text.innerText = square.text;

        // ゴール
        if (square.type === 'goal') {
            controls.innerHTML = `<button class="modal-btn btn-blue" onclick="closeModal()">クリア！</button>`;
            clearInterval(mainTimerInterval);
        }
        // 指示マス
        else if (square.type === 'instruction') {
            timerArea.style.display = 'block';
            subTime = 0;
            subTimerMode = 'up';
            updateSubTimerDisplay();
            startSubTimer(); // 指示マスに止まった瞬間カウントアップ開始

            controls.innerHTML = `
                <button class="modal-btn btn-gray" onclick="rollSubDice()">サブサイコロを振る</button><br>
                <button class="modal-btn btn-green" onclick="closeModal()">達成</button>
                <button class="modal-btn btn-blue" onclick="resetSubTimer()">カウントしなおし</button>
                <button class="modal-btn btn-red" onclick="giveUp()">ギブアップ</button>
            `;
        }
        // 赤塗マス
        else if (square.type === 'red_fill') {
            controls.innerHTML = `<button class="modal-btn btn-red" onclick="handleRedFill()">サイコロを振る</button>`;
        }
        // 紫マス (戻る)
        else if (square.type === 'purple') {
            const backNum = parseInt(square.value);
            controls.innerHTML = `<button class="modal-btn btn-purple" onclick="moveBack(${backNum})">${backNum}マス戻る</button>`;
        }
        // 赤・青マス (通常タイマー)
        else {
            if (square.value === '∞') {
                text.innerText += "\n(制限時間終了まで)";
                controls.innerHTML = `<button class="modal-btn btn-blue" onclick="closeModal()">次へ</button>`;
            } else {
                timerArea.style.display = 'block';
                subTime = parseInt(square.value);
                subTimerMode = 'down';
                updateSubTimerDisplay();
                startSubTimer();
                controls.innerHTML = `
                    <button class="modal-btn btn-blue" id="modal-next-btn" style="display:none;" onclick="closeModal()">次へ</button>
                    <button class="modal-btn btn-gray" onclick="skipSubTimer()">タイマースキップ</button>
                `;
            }
        }
        overlay.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        stopSubTimer();
    }

    // 各種特殊アクション
    function moveBack(num) {
        closeModal();
        currentPos = Math.max(0, currentPos - num);
        updatePositionDisplay();
        setTimeout(() => handleSquareEvent(boardData[currentPos]), 500); // 戻ったマスの指示を実行
    }

    function handleRedFill() {
        const dice = Math.floor(Math.random() * 6) + 1;
        const calcTime = dice * 60;
        document.getElementById('modal-text').innerText = `出目は【 ${dice} 】！\n${calcTime}秒くすぐられる！`;
        
        document.getElementById('modal-sub-timer-area').style.display = 'block';
        subTime = calcTime;
        subTimerMode = 'down';
        updateSubTimerDisplay();
        startSubTimer();

        document.getElementById('modal-controls').innerHTML = `
            <button class="modal-btn btn-blue" id="modal-next-btn" style="display:none;" onclick="closeModal()">次へ</button>
            <button class="modal-btn btn-gray" onclick="skipSubTimer()">タイマースキップ</button>
        `;
    }

    function rollSubDice() {
        const dice = Math.floor(Math.random() * 6) + 1;
        alert(`サブサイコロの目は【 ${dice} 】です！`);
    }

    function giveUp() {
        alert("【ギブアップペナルティ】\nスタートに戻り、相手の言うことを一つ聞かなければなりません。");
        closeModal();
        currentPos = 0;
        updatePositionDisplay();
    }

    // --- サブタイマー処理 ---
    function startSubTimer() {
        stopSubTimer();
        subTimerInterval = setInterval(() => {
            if (subTimerMode === 'down') {
                if (subTime > 0) subTime--;
                else { stopSubTimer(); showNextButton(); }
            } else {
                subTime++; // カウントアップ (指示マス用)
            }
            updateSubTimerDisplay();
        }, 1000);
    }

    function stopSubTimer() { if(subTimerInterval) clearInterval(subTimerInterval); }
    function resetSubTimer() { subTime = 0; updateSubTimerDisplay(); }
    
    function skipSubTimer() {
        stopSubTimer();
        subTime = 0;
        updateSubTimerDisplay();
        showNextButton();
    }

    function showNextButton() {
        const btn = document.getElementById('modal-next-btn');
        if(btn) btn.style.display = 'inline-block';
    }

    function updateSubTimerDisplay() {
        const m = Math.floor(subTime / 60).toString().padStart(2, '0');
        const s = (subTime % 60).toString().padStart(2, '0');
        document.getElementById('modal-sub-timer-display').innerText = `${m}:${s}`;
    }

    // --- 盤面一覧描画 ---
    function renderBoardList() {
        const container = document.getElementById('board-list-container');
        container.innerHTML = '';
        boardData.forEach(sq => {
            const div = document.createElement('div');
            div.className = `board-item type-${sq.type}`;
            div.innerHTML = `<strong>マス${sq.id} [${sq.type}]</strong><br>${sq.text}`;
            container.appendChild(div);
        });
    }

    // --- シナリオ一括出力機能 ---
    function generateScenario() {
        let pos = 0;
        let time = 3600;
        let log = "=== シナリオ一括シミュレーション ===\n\n";
        let turn = 1;

        while (time > 0 && pos < boardData.length - 1) {
            const dice = Math.floor(Math.random() * 6) + 1;
            pos = Math.min(boardData.length - 1, pos + dice);
            let sq = boardData[pos];
            
            log += `【ターン${turn}】 ダイス:${dice} ➔ マス${sq.id} に移動\n`;
            log += `内容: ${sq.text}\n`;

            if (sq.type === 'red' || sq.type === 'blue') {
                if(sq.value !== '∞') time -= parseInt(sq.value);
            } 
            else if (sq.type === 'red_fill') {
                const subDice = Math.floor(Math.random() * 6) + 1;
                const penaltyTime = subDice * 60;
                log += `  -> 追加ダイス:${subDice} ➔ ${penaltyTime}秒消費\n`;
                time -= penaltyTime;
            }
            else if (sq.type === 'purple') {
                pos = Math.max(0, pos - parseInt(sq.value));
                sq = boardData[pos];
                log += `  -> ${sq.value}マス戻る ➔ 現在マス${sq.id}\n`;
                log += `  -> 戻り先内容: ${sq.text}\n`;
                // 紫で戻った先が赤/青の場合の時間消費（簡略化）
                if ((sq.type === 'red' || sq.type === 'blue') && sq.value !== '∞') {
                    time -= parseInt(sq.value);
                }
            }
            else if (sq.type === 'instruction') {
                log += `  -> (※指示マスの詳細な処理やペナルティ時間はシナリオ上で自由に補完してください)\n`;
            }

            const m = Math.floor(Math.max(0, time) / 60).toString().padStart(2, '0');
            const s = (Math.max(0, time) % 60).toString().padStart(2, '0');
            log += `--- [残り時間 ${m}:${s}] ---\n\n`;
            turn++;
            
            if(turn > 200) { log += "※ループ上限到達\n"; break; } // 安全装置
        }

        if (pos >= boardData.length - 1) log += "★ ゴール達成！ ★\n";
        else log += "☠ 制限時間オーバー（ゲームオーバー） ☠\n";

        document.getElementById('scenario-output').value = log;
    }
</script>
</body>
</html>
